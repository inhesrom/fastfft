# cargo-deny configuration. The published library (`fastfft`) is MPL-2.0 (see
# the exception below) and may only depend on MIT/Apache-compatible crates. Benchmark-only crates used by the
# unpublished arena get narrow exceptions below (FFTW itself is linked as a C
# library by the arena and never becomes a dependency of `fastfft`).

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
exceptions = [
    # fastfft's own license. Scoped so MPL-2.0 dependencies still need review.
    { allow = ["MPL-2.0"], crate = "fastfft" },
    # Benchmark-only (arena, never published): BSD-3-Clause-Clear, no patent grant.
    { allow = ["BSD-3-Clause-Clear"], crate = "tfhe-fft" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
