[dependencies.hashbrown]
version = "0.17"

[dependencies.libm]
version = "0.2"

[dependencies.ndarray]
version = "0.17.2"
optional = true

[dependencies.num-complex]
version = "0.4"
default-features = false

[dependencies.num-traits]
version = "0.2"
features = ["libm"]
default-features = false

[dependencies.oxicuda-driver]
version = "0.5.3"
optional = true

[dependencies.oxicuda-fft]
version = "0.5.3"
optional = true

[dependencies.oxicuda-metal]
version = "0.5.3"
optional = true

[dependencies.oxifft-codegen]
version = "0.4.2"

[dependencies.rayon]
version = "1.12"
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "alloc",
]
default-features = false

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.spin]
version = "0.12"
features = [
    "spin_mutex",
    "rwlock",
    "once",
    "lazy",
]
default-features = false

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dev-dependencies.approx]
version = "0.5"

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[dev-dependencies.proptest]
version = "1.11"

[dev-dependencies.rustfft]
version = "6.4"

[lints.clippy]
